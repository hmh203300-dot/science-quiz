<!DOCTYPE html>
<html lang="ko">
<head>

  <script src="https://cdn.tailwindcss.com"></script>
  <style>

    .choice-btn:hover:not(:disabled) { transform: translateY(-1px); }
    @media print {
      .no-print { display: none !important; }
      body { background-color: white; }

        <h1 class="text-xl font-bold mt-1">07. 생물과 환경 & 08. 생태계평형 (20문항)</h1>

      <div class="flex items-center gap-2">

        <button onclick="setMode('study')" id="btn-mode-study" class="px-3 py-1.5 text-sm font-medium rounded-lg bg-indigo-800 text-indigo-100 hover:bg-indigo-700">즉시 해설 모드</button>

      </div>
    </div>
    <!-- 진행률 바 -->
    <div class="w-full bg-indigo-950 h-2">

    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-6">

    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-wrap justify-between items-center gap-3 no-print">
      <div class="flex flex-wrap gap-2" id="filter-tabs">
        <button onclick="filterQuestions('all')" class="filter-btn active px-3 py-1.5 rounded-lg text-sm font-semibold bg-slate-800 text-white">전체 (20)</button>
        <button onclick="filterQuestions('basic')" class="filter-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">기본 개념형 (10)</button>
        <button onclick="filterQuestions('applied')" class="filter-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">응용·함정형 (5)</button>

      </div>
      <div class="text-sm font-medium text-slate-600">
        응답 완료: <span id="answered-count" class="text-indigo-600 font-bold">0</span> / 20
      </div>
    </div>

    <!-- 채점 결과 대시보드 (제출 시 표시) -->

        <div>
          <h2 class="text-2xl font-bold">채점 결과 리포트</h2>
          <p class="text-indigo-100 text-sm mt-1">아래 각 문항에서 정답 해설과 오답 첨삭을 확인하세요.</p>
        </div>
        <div class="flex items-center gap-6 bg-white/10 px-6 py-4 rounded-xl backdrop-blur-sm">
          <div class="text-center">
            <div class="text-xs text-indigo-200">총점</div>
            <div class="text-3xl font-extrabold" id="score-total">0점</div>
          </div>
          <div class="h-8 w-px bg-white/20"></div>
          <div class="text-center">
            <div class="text-xs text-indigo-200">정답 수</div>
            <div class="text-xl font-bold" id="score-fraction">0 / 20</div>
          </div>
          <div class="h-8 w-px bg-white/20"></div>
          <div class="text-xs space-y-1 text-left">

        </div>

        <button onclick="resetQuiz()" class="px-4 py-2 bg-white text-indigo-900 hover:bg-indigo-50 text-sm font-semibold rounded-lg shadow">다시 풀기</button>
      </div>
    </div>

    <!-- 문제 리스트 컨테이너 -->
    <div id="questions-container" class="space-y-6"></div>

    <!-- 하단 제출 바 -->
    <div id="submit-bar" class="mt-8 bg-white p-5 rounded-xl shadow-md border border-slate-200 flex justify-between items-center no-print">

      <div class="flex gap-3">
        <button onclick="resetQuiz()" class="px-4 py-2.5 rounded-xl border border-slate-300 text-slate-700 font-medium hover:bg-slate-100 text-sm">초기화</button>

    let currentMode = 'exam'; // 'exam' | 'study'
    let currentFilter = 'all';
    let userAnswers = new Array(quizData.length).fill(null);
    let isSubmitted = false;

    function renderQuestions() {
      const container = document.getElementById('questions-container');
      container.innerHTML = '';

      quizData.forEach((q, idx) => {
        if (currentFilter !== 'all' && currentFilter !== 'wrong' && q.type !== currentFilter) return;
        if (currentFilter === 'wrong' && (!isSubmitted || userAnswers[idx] === q.answer)) return;

        const selected = userAnswers[idx];
        const showFeedback = isSubmitted || (currentMode === 'study' && selected !== null);
        const isCorrect = selected === q.answer;

        let badgeColor = 'bg-blue-100 text-blue-800';
        if (q.type === 'applied') badgeColor = 'bg-amber-100 text-amber-800';
        if (q.type === 'data') badgeColor = 'bg-purple-100 text-purple-800';

        let statusBadge = '';
        if (showFeedback) {
          statusBadge = isCorrect
            ? `<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700">정답 (O)</span>`
            : `<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-rose-100 text-rose-700">오답 (X)</span>`;
        }

        const choicesHtml = q.choices.map((cText, cIdx) => {
          const numSymbol = ['①', '②', '③', '④', '⑤'][cIdx];
          let btnStyle = 'border-slate-200 bg-white hover:bg-slate-50 text-slate-700';

          if (showFeedback) {
            if (cIdx === q.answer) {
              btnStyle = 'border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold ring-2 ring-emerald-500/20';
            } else if (selected === cIdx && cIdx !== q.answer) {
              btnStyle = 'border-rose-400 bg-rose-50 text-rose-900 line-through';
            }
          } else if (selected === cIdx) {
            btnStyle = 'border-indigo-600 bg-indigo-50 text-indigo-900 font-semibold ring-2 ring-indigo-600/20';
          }

          return `
            <button onclick="selectChoice(${idx}, ${cIdx})" 
              class="choice-btn w-full text-left p-3.5 rounded-xl border ${btnStyle} flex items-start gap-2.5 text-sm">
              <span class="font-bold shrink-0">${numSymbol}</span>
              <span>${cText}</span>
            </button>
          `;
        }).join('');

        const wrongNotesHtml = q.wrongNotes && q.wrongNotes.length > 0
          ? `<div class="mt-3 pt-3 border-t border-slate-200/80">
               <div class="text-xs font-bold text-rose-700 mb-1">📌 오답 선지 첨삭</div>
               <ul class="space-y-1 text-xs text-slate-600">
                 ${q.wrongNotes.map(n => `<li>${n}</li>`).join('')}
               </ul>
             </div>`
          : '';

        const feedbackHtml = showFeedback ? `
          <div class="mt-5 p-4 rounded-xl ${isCorrect ? 'bg-emerald-50/70 border border-emerald-200' : 'bg-rose-50/70 border border-rose-200'} text-sm">
            <div class="font-bold ${isCorrect ? 'text-emerald-800' : 'text-rose-800'} mb-1">
              정답: ${['①', '②', '③', '④', '⑤'][q.answer]}
            </div>
            <div class="text-slate-700 leading-relaxed"><strong class="text-slate-900">[해설]</strong> ${q.explanation}</div>
            ${wrongNotesHtml}
          </div>
        ` : '';

        const card = document.createElement('div');
        card.className = 'q-card bg-white p-6 rounded-2xl shadow-sm border border-slate-200';
        card.innerHTML = `
          <div class="flex justify-between items-center mb-3">
            <div class="flex items-center gap-2">
              <span class="text-lg font-extrabold text-indigo-900">Q${String(q.id).padStart(2, '0')}.</span>
              <span class="px-2.5 py-0.5 rounded-md text-xs font-semibold ${badgeColor}">${q.badge}</span>
            </div>
            ${statusBadge}
          </div>
          <p class="font-bold text-base text-slate-900 mb-4 leading-snug">${q.question}</p>
          ${q.box ? `<div class="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-4 text-sm">${q.box}</div>` : ''}
          <div class="space-y-2">
            ${choicesHtml}
          </div>
          ${feedbackHtml}
        `;
        container.appendChild(card);
      });

      updateProgress();
    }

    function selectChoice(qIdx, cIdx) {
      if (isSubmitted && currentMode === 'exam') return;
      userAnswers[qIdx] = cIdx;
      renderQuestions();
    }

    function updateProgress() {
      const answered = userAnswers.filter(a => a !== null).length;
      document.getElementById('answered-count').innerText = answered;
      const pct = Math.round((answered / quizData.length) * 100);
      document.getElementById('progress-bar').style.width = pct + '%';
    }

    function setMode(mode) {
      currentMode = mode;
      const btnExam = document.getElementById('btn-mode-exam');
      const btnStudy = document.getElementById('btn-mode-study');
      const submitBar = document.getElementById('submit-bar');

      if (mode === 'exam') {
        btnExam.className = 'px-3 py-1.5 text-sm font-medium rounded-lg bg-white text-indigo-900 shadow-sm';
        btnStudy.className = 'px-3 py-1.5 text-sm font-medium rounded-lg bg-indigo-800 text-indigo-100 hover:bg-indigo-700';
        submitBar.classList.remove('hidden');
      } else {
        btnStudy.className = 'px-3 py-1.5 text-sm font-medium rounded-lg bg-white text-indigo-900 shadow-sm';
        btnExam.className = 'px-3 py-1.5 text-sm font-medium rounded-lg bg-indigo-800 text-indigo-100 hover:bg-indigo-700';
        submitBar.classList.add('hidden');
      }
      renderQuestions();
    }

    function filterQuestions(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.className = 'filter-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200';
      });
      event.target.className = 'filter-btn active px-3 py-1.5 rounded-lg text-sm font-semibold bg-slate-800 text-white';
      renderQuestions();
    }

    function submitQuiz() {
      isSubmitted = true;
      let totalCorrect = 0, basicCorrect = 0, appliedCorrect = 0, dataCorrect = 0;

      quizData.forEach((q, idx) => {
        if (userAnswers[idx] === q.answer) {
          totalCorrect++;
          if (q.type === 'basic') basicCorrect++;
          if (q.type === 'applied') appliedCorrect++;
          if (q.type === 'data') dataCorrect++;
        }
      });

      document.getElementById('score-total').innerText = (totalCorrect * 5) + '점';
      document.getElementById('score-fraction').innerText = `${totalCorrect} / 20`;
      document.getElementById('score-basic').innerText = `${basicCorrect}/10`;
      document.getElementById('score-applied').innerText = `${appliedCorrect}/5`;
      document.getElementById('score-data').innerText = `${dataCorrect}/5`;

      document.getElementById('result-dashboard').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderQuestions();
    }

    function filterWrongOnly() {
      currentFilter = 'wrong';
      renderQuestions();
    }

    function resetQuiz() {
      userAnswers = new Array(quizData.length).fill(null);
      isSubmitted = false;
      currentFilter = 'all';
      document.getElementById('result-dashboard').classList.add('hidden');
      renderQuestions();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 초기 렌더링
    renderQuestions();
  </script>

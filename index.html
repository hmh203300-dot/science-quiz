<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2022 개정 통합과학2 - 생물과 환경 & 생태계평형 실전 테스트</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; position: relative; }
    .choice-btn { transition: all 0.15s ease-in-out; }
    .choice-btn:hover:not(:disabled) { transform: translateY(-1px); }
    
    #draw-canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 40;
      pointer-events: none;
    }
    #draw-canvas.drawing-active {
      pointer-events: auto;
      touch-action: none;
      cursor: crosshair;
    }

    @media print {
      .no-print { display: none !important; }
      body { background-color: white; }
      .q-card { break-inside: avoid; border: 1px solid #cbd5e1 !important; box-shadow: none !important; margin-bottom: 1.5rem; }
    }
  </style>
</head>
<body class="text-slate-800 pb-28">

  <canvas id="draw-canvas" class="no-print"></canvas>

  <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-50 no-print">
    <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
      <div>
        <span class="text-xs font-semibold bg-indigo-700 px-2.5 py-1 rounded-full uppercase tracking-wider">2022 개정 통합과학2</span>
        <h1 class="text-xl font-bold mt-1">07. 생물과 환경 & 08. 생태계평형 (20문항)</h1>
      </div>
      <div class="flex items-center gap-2">
        <span class="px-3 py-1.5 text-sm font-bold rounded-lg bg-white text-indigo-900 shadow-sm">즉시 해설 모드</span>
        <button onclick="resetQuiz()" class="px-3 py-1.5 text-sm font-medium rounded-lg bg-indigo-800 text-indigo-100 hover:bg-indigo-700">전체 초기화</button>
        <button onclick="window.print()" class="px-3 py-1.5 text-sm font-medium rounded-lg bg-emerald-600 text-white hover:bg-emerald-500">인쇄</button>
      </div>
    </div>
    <div class="w-full bg-indigo-950 h-2">
      <div id="progress-bar" class="bg-emerald-400 h-2 transition-all duration-300" style="width: 0%"></div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-6">
    
    <!-- 실시간 채점 결과 대시보드 & 카톡 공유 & 오답 다시 풀기 -->
    <div id="result-dashboard" class="bg-gradient-to-r from-indigo-600 to-violet-700 text-white p-5 sm:p-6 rounded-2xl shadow-lg mb-6 no-print">
      <div class="flex flex-col md:flex-row justify-between items-center gap-5">
        <div>
          <div class="inline-block px-2.5 py-0.5 rounded-full text-xs font-bold bg-white/20 text-indigo-100 mb-1">실시간 채점 현황</div>
          <h2 class="text-2xl font-bold">나의 점수 & 오답 리포트</h2>
          <p class="text-indigo-100 text-xs sm:text-sm mt-1">문제를 풀면 점수가 즉시 반영되며, 카톡 공유 및 오답 재풀이가 가능합니다.</p>
        </div>
        <div class="flex items-center gap-4 sm:gap-6 bg-white/10 px-5 py-3.5 rounded-xl backdrop-blur-sm w-full md:w-auto justify-around">
          <div class="text-center">
            <div class="text-xs text-indigo-200">현재 총점</div>
            <div class="text-2xl sm:text-3xl font-extrabold text-amber-300" id="score-total">0점</div>
          </div>
          <div class="h-8 w-px bg-white/20"></div>
          <div class="text-center">
            <div class="text-xs text-indigo-200">정답 / 오답</div>
            <div class="text-lg sm:text-xl font-bold">
              <span id="score-correct" class="text-emerald-300">0</span>
              <span class="text-white/50 text-sm mx-0.5">/</span>
              <span id="score-wrong" class="text-rose-300">0</span>
            </div>
          </div>
          <div class="h-8 w-px bg-white/20"></div>
          <div class="text-xs space-y-1 text-left">
            <div>기본 개념: <span id="score-basic" class="font-bold">0/10</span></div>
            <div>응용·함정: <span id="score-applied" class="font-bold">0/5</span></div>
            <div>자료해석: <span id="score-data" class="font-bold">0/5</span></div>
          </div>
        </div>
      </div>
      <div class="mt-4 pt-4 border-t border-white/20 flex flex-wrap justify-end gap-2.5">
        <button onclick="copyKakaoResult()" class="px-4 py-2 bg-amber-400 hover:bg-amber-500 text-slate-950 font-bold text-xs sm:text-sm rounded-lg shadow flex items-center gap-1.5 transition">
          <span>💬</span> 카톡으로 점수 공유 (복사)
        </button>
        <button onclick="filterWrongOnly()" class="px-4 py-2 bg-rose-500/90 hover:bg-rose-600 text-white text-xs sm:text-sm font-semibold rounded-lg shadow transition">
          📌 오답만 보기 (<span id="btn-wrong-count">0</span>)
        </button>
        <button onclick="retryWrongQuestions()" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white text-xs sm:text-sm font-bold rounded-lg shadow flex items-center gap-1 transition">
          <span>🔄</span> 틀린 문제만 다시 풀기
        </button>
        <button onclick="resetQuiz()" class="px-3.5 py-2 bg-white/90 text-indigo-900 hover:bg-white text-xs sm:text-sm font-semibold rounded-lg shadow transition">
          전체 다시 풀기
        </button>
      </div>
    </div>

    <!-- 카테고리 필터 탭 -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-wrap justify-between items-center gap-3 no-print">
      <div class="flex flex-wrap gap-2" id="filter-tabs">
        <button id="tab-all" onclick="filterQuestions('all', event)" class="filter-btn active px-3 py-1.5 rounded-lg text-sm font-semibold bg-slate-800 text-white">전체 (20)</button>
        <button id="tab-basic" onclick="filterQuestions('basic', event)" class="filter-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">기본 개념형 (10)</button>
        <button id="tab-applied" onclick="filterQuestions('applied', event)" class="filter-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">응용·함정형 (5)</button>
        <button id="tab-data" onclick="filterQuestions('data', event)" class="filter-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">자료해석형 (5)</button>
        <button id="tab-wrong" onclick="filterWrongOnly()" class="filter-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-rose-50 text-rose-600 border border-rose-200 hover:bg-rose-100">오답 노트</button>
      </div>
      <div class="text-sm font-medium text-slate-600">
        응답 완료: <span id="answered-count" class="text-indigo-600 font-bold">0</span> / 20
      </div>
    </div>

    <!-- 틀린 문제 다시 풀기 모드 안내 배너 -->
    <div id="retry-banner" class="hidden bg-amber-50 border border-amber-300 text-amber-900 px-4 py-3 rounded-xl mb-6 flex justify-between items-center text-sm no-print">
      <div class="font-semibold flex items-center gap-2">
        <span>🔥</span>
        <span id="retry-banner-text">틀린 문제 다시 풀기 모드입니다. 오답 문항들을 다시 풀어보세요!</span>
      </div>
      <button onclick="filterQuestions('all')" class="px-3 py-1 bg-amber-200/70 hover:bg-amber-300 text-amber-950 rounded-lg text-xs font-bold transition">
        전체 문항 보기
      </button>
    </div>

    <div id="questions-container" class="space-y-6"></div>

  </main>

  <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 backdrop-blur-md text-white px-3.5 py-2 rounded-full shadow-2xl flex items-center gap-2 border border-slate-700 text-xs sm:text-sm whitespace-nowrap no-print">
    <button id="btn-draw-toggle" onclick="toggleDrawMode()" class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-slate-800 hover:bg-slate-700 font-bold transition">
      <span>✏️</span> <span id="pen-text">필기 켜기</span>
    </button>
    
    <div id="draw-tools" class="hidden flex items-center gap-2 pl-2 border-l border-slate-700">
      <button onclick="selectPen('#ef4444')" id="pen-red" class="w-6 h-6 rounded-full bg-red-500 border-2 border-white ring-2 ring-red-400 transition" title="빨간펜"></button>
      <button onclick="selectPen('#2563eb')" id="pen-blue" class="w-6 h-6 rounded-full bg-blue-600 border-2 border-transparent hover:scale-110 transition" title="파란펜"></button>
      <button onclick="selectPen('#1e293b')" id="pen-black" class="w-6 h-6 rounded-full bg-slate-800 border-2 border-slate-400 hover:scale-110 transition" title="검은펜"></button>
      
      <div class="h-4 w-px bg-slate-700 mx-0.5"></div>

      <button onclick="selectEraser()" id="btn-eraser" class="px-2.5 py-1 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold flex items-center gap-1 transition">
        <span>🧽</span> 지우개
      </button>

      <button onclick="clearCanvas()" class="px-2.5 py-1 rounded-full bg-rose-900/70 hover:bg-rose-700 text-rose-200 font-semibold transition">
        전체 삭제
      </button>
    </div>
  </div>

      if (canvas.width !== docWidth || canvas.height !== docHeight) {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvas.width;

        const tempCtx = tempCanvas.getContext('2d');
        if (canvas.width > 0 && canvas.height > 0) {

            : `<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-rose-100 text-rose-700">오답 (X)</span>`;
        }

        const choicesHtml = q.choices.map((cText, cIdx) => {
          const numSymbol = ['①', '②', '③', '④', '⑤'][cIdx];
          let btnStyle = 'border-slate-200 bg-white hover:bg-slate-50 text-slate-700';

          if (showFeedback) {
            if (cIdx === q.answer) {
              btnStyle = 'border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold ring-2 ring-emerald-500/20';
            } else if (selected === cIdx && cIdx !== q.answer) {
              btnStyle = 'border-rose-400 bg-rose-50 text-rose-900 line-through';
            }
          }

          return `
            <button onclick="selectChoice(${idx}, ${cIdx})" 
              class="choice-btn w-full text-left p-3.5 rounded-xl border ${btnStyle} flex items-start gap-2.5 text-sm">
              <span class="font-bold shrink-0">${numSymbol}</span>
              <span>${cText}</span>
            </button>
          `;
        }).join('');

        const wrongNotesHtml = q.wrongNotes && q.wrongNotes.length > 0
          ? `<div class="mt-3 pt-3 border-t border-slate-200/80">
               <div class="text-xs font-bold text-rose-700 mb-1">📌 오답 선지 첨삭</div>
               <ul class="space-y-1 text-xs text-slate-600">
                 ${q.wrongNotes.map(n => `<li>${n}</li>`).join('')}
               </ul>
             </div>`
          : '';

        const feedbackHtml = showFeedback ? `
          <div class="mt-5 p-4 rounded-xl ${isCorrect ? 'bg-emerald-50/70 border border-emerald-200' : 'bg-rose-50/70 border border-rose-200'} text-sm">
            <div class="font-bold ${isCorrect ? 'text-emerald-800' : 'text-rose-800'} mb-1">
              정답: ${['①', '②', '③', '④', '⑤'][q.answer]}
            </div>
            <div class="text-slate-700 leading-relaxed"><strong class="text-slate-900">[해설]</strong> ${q.explanation}</div>
            ${wrongNotesHtml}
          </div>
        ` : '';

        const card = document.createElement('div');
        card.className = 'q-card bg-white p-6 rounded-2xl shadow-sm border border-slate-200';
        card.innerHTML = `
          <div class="flex justify-between items-center mb-3">
            <div class="flex items-center gap-2">
              <span class="text-lg font-extrabold text-indigo-900">Q${String(q.id).padStart(2, '0')}.</span>
              <span class="px-2.5 py-0.5 rounded-md text-xs font-semibold ${badgeColor}">${q.badge}</span>
            </div>
            ${statusBadge}
          </div>
          <p class="font-bold text-base text-slate-900 mb-4 leading-snug">${q.question}</p>
          ${q.box ? `<div class="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-4 text-sm">${q.box}</div>` : ''}
          <div class="space-y-2">
            ${choicesHtml}
          </div>
          ${feedbackHtml}
        `;
        container.appendChild(card);
      });

      if (renderedCount === 0) {
        container.innerHTML = `
          <div class="bg-white p-10 rounded-2xl border border-slate-200 text-center text-slate-600">
            <p class="text-base font-bold text-slate-800 mb-1">현재 틀린 문제가 없습니다! 🎉</p>
            <p class="text-xs text-slate-500 mb-4">문제를 풀다가 오답이 발생하면 이곳에 표시됩니다.</p>
            <button onclick="filterQuestions('all')" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-xs font-bold hover:bg-indigo-700">전체 문제 보기로 돌아가기</button>
          </div>
        `;
      }

      updateProgressAndScore();
      setTimeout(syncCanvasSize, 50);
    }

    function selectChoice(qIdx, cIdx) {
      userAnswers[qIdx] = cIdx;
      renderQuestions();
    }

    // 실시간 점수, 정답/오답 수, 진행률 업데이트
    function updateProgressAndScore() {
      const answered = userAnswers.filter(a => a !== null).length;
      document.getElementById('answered-count').innerText = answered;
      const pct = Math.round((answered / quizData.length) * 100);
      document.getElementById('progress-bar').style.width = pct + '%';

      let totalCorrect = 0, totalWrong = 0;
      let basicCorrect = 0, appliedCorrect = 0, dataCorrect = 0;

      quizData.forEach((q, idx) => {
        if (userAnswers[idx] !== null) {
          if (userAnswers[idx] === q.answer) {
            totalCorrect++;
            if (q.type === 'basic') basicCorrect++;
            if (q.type === 'applied') appliedCorrect++;
            if (q.type === 'data') dataCorrect++;
          } else {
            totalWrong++;
          }
        }
      });

      document.getElementById('score-total').innerText = (totalCorrect * 5) + '점';
      document.getElementById('score-correct').innerText = `${totalCorrect}개`;
      document.getElementById('score-wrong').innerText = `${totalWrong}개`;
      document.getElementById('btn-wrong-count').innerText = totalWrong;
      document.getElementById('score-basic').innerText = `${basicCorrect}/10`;
      document.getElementById('score-applied').innerText = `${appliedCorrect}/5`;
      document.getElementById('score-data').innerText = `${dataCorrect}/5`;
    }

    function setActiveTabStyle(activeId) {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.id === 'tab-wrong') {
          btn.className = 'filter-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-rose-50 text-rose-600 border border-rose-200 hover:bg-rose-100';
        } else {
          btn.className = 'filter-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200';
        }
      });
      const activeBtn = document.getElementById(activeId);
      if (activeBtn) {
        activeBtn.className = 'filter-btn active px-3 py-1.5 rounded-lg text-sm font-semibold bg-slate-800 text-white';
      }
    }

    function filterQuestions(type, ev) {
      currentFilter = type;
      setActiveTabStyle('tab-' + type);
      renderQuestions();
    }

    // 오답만 모아보기 (해설이 켜진 상태로 확인)
    function filterWrongOnly() {
      currentFilter = 'wrong';
      setActiveTabStyle('tab-wrong');
      renderQuestions();
    }

    // 틀린 문제들만 선택 초기화하고 다시 풀어보기
    function retryWrongQuestions() {
      const wrongIndices = [];
      quizData.forEach((q, idx) => {
        if (userAnswers[idx] !== null && userAnswers[idx] !== q.answer) {
          wrongIndices.push(idx);
        }
      });

      if (wrongIndices.length === 0) {
        alert('현재 틀린 문제가 없습니다! 먼저 문제를 풀어보세요.');
        return;
      }

      retryTargetIndices = wrongIndices;
      // 틀린 문제들의 기존 답안을 지워서 다시 풀 수 있게 초기화
      wrongIndices.forEach(idx => {
        userAnswers[idx] = null;
      });

      currentFilter = 'retry';
      setActiveTabStyle('tab-wrong');
      document.getElementById('retry-banner-text').innerText = `틀린 문제(${wrongIndices.length}문항)의 답안이 초기화되었습니다. 다시 풀어보세요!`;
      renderQuestions();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetQuiz() {
      userAnswers = new Array(quizData.length).fill(null);
      retryTargetIndices = [];
      currentFilter = 'all';
      setActiveTabStyle('tab-all');
      clearCanvas();
      renderQuestions();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 카카오톡 결과 제출(텍스트 클립보드 복사) 함수
    function copyKakaoResult() {
      const answered = userAnswers.filter(a => a !== null).length;
      let totalCorrect = 0, totalWrong = 0;
      let basicCorrect = 0, appliedCorrect = 0, dataCorrect = 0;
      const wrongNumbers = [];

      quizData.forEach((q, idx) => {
        if (userAnswers[idx] !== null) {
          if (userAnswers[idx] === q.answer) {
            totalCorrect++;
            if (q.type === 'basic') basicCorrect++;
            if (q.type === 'applied') appliedCorrect++;
            if (q.type === 'data') dataCorrect++;
          } else {
            totalWrong++;
            wrongNumbers.push(q.id + '번');
          }
        }
      });

      const totalScore = totalCorrect * 5;
      const wrongListStr = wrongNumbers.length > 0 ? wrongNumbers.join(', ') : '없음 (만점!)';

      const resultText = `[2022 개정 통합과학2 퀴즈 결과 제출]
• 단원: 07. 생물과 환경 & 08. 생태계평형
• 총점: ${totalScore}점 (응답 ${answered}/20문항)
• 정답: ${totalCorrect}개 / 오답: ${totalWrong}개
• 틀린 문항: ${wrongListStr}
--------------------------
• 기본 개념형: ${basicCorrect}/10
• 응용·함정형: ${appliedCorrect}/5
• 자료해석형: ${dataCorrect}/5`;

      navigator.clipboard.writeText(resultText).then(() => {
        alert('채점 결과가 카카오톡 공유용으로 복사되었습니다!\n카톡 채팅창에 붙여넣기(Ctrl+V) 하세요.');
      }).catch(err => {
        console.error('복사 실패:', err);
        alert('복사에 실패했습니다. 브라우저 권한을 확인해주세요.');
      });
    }
  </script>
</body>
</html>
